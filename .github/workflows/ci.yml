name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Space-separated via YAML folded scalar. Used by both rust jobs to
  # cache the Tauri system deps install.
  TAURI_SYSTEM_DEPS: >-
    libwebkit2gtk-4.1-dev
    libappindicator3-dev
    librsvg2-dev
    patchelf
    libgtk-3-dev
    libsoup-3.0-dev
    libjavascriptcoregtk-4.1-dev

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
    steps:
      - uses: actions/github-script@v7
        id: docs-only
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('docs_only', 'false');
              return;
            }

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const docsOnly = files.length > 0 && files.every((file) =>
              file.filename.startsWith('docs/') || file.filename === 'mkdocs.yml'
            );
            core.setOutput('docs_only', String(docsOnly));

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test

  rust-clippy:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - name: Cache Tauri system deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ env.TAURI_SYSTEM_DEPS }}
          version: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: clippy
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - name: Cache Tauri system deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ env.TAURI_SYSTEM_DEPS }}
          version: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: test
      - name: Test
        working-directory: src-tauri
        run: cargo nextest run --workspace

  # Exhaustive integration tests for the `roux-worktrunk` wrapper that
  # exercise the real `wt` binary against real temp git repositories.
  # Kept in its own job because the default `cargo test --workspace`
  # (above) should pass on machines without worktrunk installed.
  worktrunk-integration:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: worktrunk-integration
      - name: Install worktrunk (pinned to MIN_WT_VERSION)
        run: cargo install worktrunk --version 0.44.0 --locked --no-default-features --features cli
      - name: Configure git identity for test repos
        run: |
          git config --global user.email t@t.test
          git config --global user.name  "Test"
      - name: Run real-wt integration tests
        run: cargo test -p roux-worktrunk --features real-wt-integration --test real_wt
