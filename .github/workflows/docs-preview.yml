name: Preview docs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to update with the preview link
        required: true
        type: number

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREVIEW_PREFIX: previews/pr-${{ inputs.pr_number }}
      PREVIEW_URL: https://phin-tech.github.io/roux/previews/pr-${{ inputs.pr_number }}/
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: docs/uv.lock

      - name: Install docs dependencies
        run: |
          uv sync --project docs --frozen
          echo "$GITHUB_WORKSPACE/docs/.venv/bin" >> $GITHUB_PATH

      - name: Configure Git author
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Fetch existing published docs
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
          fi

      - name: Publish preview docs
        run: |
          mike deploy --branch gh-pages --deploy-prefix "$PREVIEW_PREFIX" preview
          mike set-default --branch gh-pages --deploy-prefix "$PREVIEW_PREFIX" preview

      - name: Archive published site
        run: |
          rm -rf site
          mkdir -p site
          git archive gh-pages | tar -x -C site

      - name: Push gh-pages history
        run: git push origin gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      PREVIEW_URL: https://phin-tech.github.io/roux/previews/pr-${{ inputs.pr_number }}/
    steps:
      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- docs-preview-comment -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const shortSha = context.sha.slice(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const body = [
              marker,
              `Docs preview updated for \`${branch}\`: [Open preview](${process.env.PREVIEW_URL})`,
              '',
              `Commit: \`${shortSha}\``,
            ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
