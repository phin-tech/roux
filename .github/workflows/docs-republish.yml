name: Republish docs version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docs version to overwrite (e.g. 0.5.0 or v0.5.0)"
        required: true
        type: string
      source_ref:
        description: "Git ref to build docs from"
        required: false
        default: main
        type: string
      update_latest:
        description: "Also move the latest alias and default version"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Normalize version
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Version cannot be empty." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: docs/uv.lock

      - name: Install dependencies
        run: |
          uv sync --project docs --frozen
          echo "$GITHUB_WORKSPACE/docs/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure Git author
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Fetch existing versioned docs
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages --depth=1
          fi

      - name: Install Cairo for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Republish versioned docs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
          SOCIAL_CARDS: "true"
        run: |
          set -euo pipefail
          if [[ "$UPDATE_LATEST" == "true" ]]; then
            mike deploy --update-aliases "$VERSION" latest
            mike set-default latest
          else
            mike deploy "$VERSION"
          fi

      - name: Archive versioned site
        run: |
          rm -rf site
          mkdir -p site
          git archive gh-pages | tar -x -C site

      - name: Overlay /docs back-compat redirect
        run: cp -R docs/landing/. site/

      - name: Push gh-pages history
        run: git push origin gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
