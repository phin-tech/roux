name: Deploy docs

on:
  push:
    branches:
      - main
    # Tags are NOT path-filtered: a release tag must always publish docs,
    # even when the tagged commit touches no docs files. (A `paths:` filter
    # would silently skip tag pushes.)
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skip prerelease tags (handled by docs-prerelease.yml). Runs on main
    # pushes and stable tags.
    if: github.ref_type != 'tag' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: docs/uv.lock

      - name: Install docs dependencies
        run: |
          uv sync --project docs --frozen
          echo "$GITHUB_WORKSPACE/docs/.venv/bin" >> $GITHUB_PATH

      - name: Install Cairo for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Configure Git author
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Fetch existing published docs
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages --depth=1
          fi

      - name: Validate docs (strict)
        # No SOCIAL_CARDS here: social cards are skipped so this is a fast
        # link-check. mike build (below) does not support --strict.
        run: mkdocs build --strict --site-dir /tmp/docs-strict

      - name: Publish docs (mike)
        env:
          SOCIAL_CARDS: "true"
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            mike deploy --branch gh-pages --update-aliases "$VERSION" latest
            mike set-default --branch gh-pages latest
            echo "Published release docs ${VERSION} (alias: latest, default)."
          else
            mike deploy --branch gh-pages dev
            echo "Published development docs (dev)."
          fi

      - name: Archive published site
        run: |
          rm -rf site
          mkdir -p site
          git archive gh-pages | tar -x -C site

      - name: Overlay /docs back-compat redirect
        run: |
          # /roux/docs/ moved to the site root; ship a redirect so old links
          # keep working. docs/landing/ contains only docs/index.html, so this
          # creates site/docs/index.html and leaves mike's root index.html intact.
          cp -R docs/landing/. site/

      - name: Push gh-pages history
        run: git push origin gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
