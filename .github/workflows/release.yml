name: Release
run-name: Release ${{ inputs.version || format('branch-{0}', inputs.branch) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build (e.g. v0.4.5-alpha.5). Leave empty for branch build."
        required: false
        type: string
      branch:
        description: "Branch to build (ignored if version is set)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-macos:
    runs-on: macos-14
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Compute release version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "release_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ inputs.branch || github.ref_name }}"
            # Normalize: lowercase, replace / and _ with -, remove other invalid chars, trim dashes
            NORMALIZED=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[/_]/-/g' | sed 's/[^a-z0-9-]//g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
            # Truncate to 40 chars to keep version reasonable
            NORMALIZED="${NORMALIZED:0:40}"
            VERSION="v0.0.0-dev.${NORMALIZED}.${{ github.run_number }}"
            echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.checkout_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Task
        run: brew install go-task
      - name: Install frontend deps
        run: npm ci
      - name: Import Developer ID cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci-setup-macos-keychain.sh
      - name: Create tag for branch build
        if: ${{ !inputs.version }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Branch build: $RELEASE_VERSION"
      - name: Sign, notarize, staple
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: task sign
      - name: Publish release + updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: task publish

  release-cli:
    runs-on: ${{ matrix.os }}
    needs: release-macos
    if: ${{ inputs.version != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-macos.outputs.release_version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Package CLI
        env:
          ROUX_CLI_VERSION: ${{ needs.release-macos.outputs.release_version }}
          ROUX_CLI_TARGET: ${{ matrix.target }}
        run: ./scripts/package-cli-release.sh
      - name: Upload CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.release-macos.outputs.release_version }}" \
            target/cli-release/roux-*.tar.gz \
            target/cli-release/roux-*.tar.gz.sha256 \
            --clobber

  update-homebrew-tap:
    runs-on: ubuntu-latest
    needs:
      - release-macos
      - release-cli
    if: ${{ inputs.version != '' }}
    steps:
      - name: Require Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN must be a token with contents write access to phin-tech/homebrew-tap." >&2
            exit 1
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: phin-tech/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formulae and casks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-macos.outputs.release_version }}
          ROUX_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_VERSION}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Refusing to update Homebrew tap for non-release version: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"

          RELEASE_JSON="$(gh release view "$TAG" --repo "$ROUX_REPO" --json isPrerelease)"
          IS_PRERELEASE="$(jq -r '.isPrerelease' <<< "$RELEASE_JSON")"

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            CHANNEL="prerelease"
            FORMULA_PATH="Formula/roux-pre.rb"
            FORMULA_CLASS="RouxPre"
            FORMULA_CONFLICT="roux"
            CASK_PATH="Casks/roux-pre.rb"
            CASK_TOKEN="roux-pre"
            CASK_CONFLICT="roux"
          else
            CHANNEL="stable"
            FORMULA_PATH="Formula/roux.rb"
            FORMULA_CLASS="Roux"
            FORMULA_CONFLICT="roux-pre"
            CASK_PATH="Casks/roux.rb"
            CASK_TOKEN="roux"
            CASK_CONFLICT="roux-pre"
          fi
          FORMULA_FILE="homebrew-tap/${FORMULA_PATH}"
          CASK_FILE="homebrew-tap/${CASK_PATH}"

          SOURCE_URL="https://github.com/${ROUX_REPO}/archive/refs/tags/${TAG}.tar.gz"
          SOURCE_SHA="$(curl -fsSL "$SOURCE_URL" | shasum -a 256 | awk '{print $1}')"

          DMG_ASSET="Roux_${VERSION}_aarch64.dmg"
          DMG_URL="https://github.com/${ROUX_REPO}/releases/download/${TAG}/${DMG_ASSET}"
          DMG_SHA="$(curl -fsSL "$DMG_URL" | shasum -a 256 | awk '{print $1}')"

          mkdir -p homebrew-tap/Formula homebrew-tap/Casks

          cat > "$FORMULA_FILE" <<EOF
          class ${FORMULA_CLASS} < Formula
            desc "Command-line client and daemon entrypoint for Roux"
            homepage "https://github.com/${ROUX_REPO}"
            url "${SOURCE_URL}"
            sha256 "${SOURCE_SHA}"
            license "MIT"
            head "https://github.com/${ROUX_REPO}.git", branch: "main"

            depends_on "pkgconf" => :build
            depends_on "rust" => :build
            depends_on "openssl@3"

            conflicts_with "${FORMULA_CONFLICT}", because: "both install the roux executable"

            def install
              ENV["OPENSSL_DIR"] = Formula["openssl@3"].opt_prefix
              system "cargo", "install", *std_cargo_args(path: "crates/roux-cli")
            end

            test do
              assert_match "roux #{version}", shell_output("#{bin}/roux --version")
              assert_match "Roux terminal manager CLI", shell_output("#{bin}/roux --help")
            end
          end
          EOF

          cat > "$CASK_FILE" <<EOF
          cask "${CASK_TOKEN}" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "https://github.com/${ROUX_REPO}/releases/download/v#{version}/Roux_#{version}_aarch64.dmg"
            name "Roux"
            desc "Desktop terminal multiplexer for Claude Code"
            homepage "https://github.com/${ROUX_REPO}"

          EOF

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            cat >> "$CASK_FILE" <<'EOF'
            livecheck do
              url "https://github.com/phin-tech/roux/releases"
              regex(/^v?(\d+(?:\.\d+)+-pre\.\d+)$/i)
              strategy :github_releases
            end
          EOF
          else
            cat >> "$CASK_FILE" <<'EOF'
            livecheck do
              url :url
              strategy :github_latest
            end
          EOF
          fi

          cat >> "$CASK_FILE" <<EOF

            auto_updates true
            conflicts_with cask: "${CASK_CONFLICT}"
            depends_on arch: :arm64
            depends_on :macos

            app "Roux.app"

            zap trash: "~/Library/Application Support/roux"
          end
          EOF

          ruby -c "$FORMULA_FILE"
          ruby -c "$CASK_FILE"

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add "$FORMULA_PATH" "$CASK_PATH"

          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew tap already up to date for ${TAG}."
            exit 0
          fi

          git -C homebrew-tap commit -m "Update Roux ${CHANNEL} to ${TAG}"
          git -C homebrew-tap push

  build-windows:
    # Temporarily disabled; re-enable when Windows publishing is back.
    if: false
    runs-on: windows-latest
    needs: release-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-macos.outputs.release_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Task
        run: choco install go-task -y
      - name: Install frontend deps
        run: npm ci
      - name: Build NSIS installer
        run: task windows:build
      - name: Upload NSIS to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.nsis.zip)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No NSIS artifacts found under src-tauri/target/release/bundle/nsis" >&2
            exit 1
          fi
          for f in "${artifacts[@]}"; do
            gh release upload "${{ needs.release-macos.outputs.release_version }}" "$f" --clobber
          done

  cleanup-old-prereleases:
    runs-on: ubuntu-latest
    needs: release-macos
    steps:
      - name: Delete prior prereleases (keep current; nightly tags fully removed)
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ needs.release-macos.outputs.release_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t stale < <(
            gh release list \
              --repo "$REPO" \
              --limit 200 \
              --json tagName,isPrerelease,isDraft \
              | jq -r --arg current "$CURRENT" \
                  '.[] | select(.isPrerelease and (.isDraft | not) and .tagName != $current) | .tagName'
          )
          if (( ${#stale[@]} == 0 )); then
            echo "No stale prereleases to delete."
            exit 0
          fi
          for tag in "${stale[@]}"; do
            if [[ "$tag" == *-nightly.* ]]; then
              echo "Deleting nightly prerelease and tag: $tag"
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
            else
              echo "Deleting prerelease (keep tag): $tag"
              gh release delete "$tag" --repo "$REPO" --yes
            fi
          done
