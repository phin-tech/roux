name: Release
run-name: Release ${{ inputs.version || format('branch-{0}', inputs.branch) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build (e.g. v0.4.5-alpha.5). Leave empty for branch build."
        required: false
        type: string
      branch:
        description: "Branch to build (ignored if version is set)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-macos:
    runs-on: macos-14
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Compute release version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "release_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ inputs.branch || github.ref_name }}"
            # Normalize: lowercase, replace / and _ with -, remove other invalid chars, trim dashes
            NORMALIZED=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[/_]/-/g' | sed 's/[^a-z0-9-]//g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
            # Truncate to 40 chars to keep version reasonable
            NORMALIZED="${NORMALIZED:0:40}"
            VERSION="v0.0.0-dev.${NORMALIZED}.${{ github.run_number }}"
            echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.checkout_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Task
        run: brew install go-task
      - name: Install frontend deps
        run: npm ci
      - name: Import Developer ID cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci-setup-macos-keychain.sh
      - name: Create tag for branch build
        if: ${{ !inputs.version }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Branch build: $RELEASE_VERSION"
      - name: Sign, notarize, staple
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: task sign
      - name: Publish release + updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: task publish

  build-windows:
    # Temporarily disabled; re-enable when Windows publishing is back.
    if: false
    runs-on: windows-latest
    needs: release-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-macos.outputs.release_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Task
        run: choco install go-task -y
      - name: Install frontend deps
        run: npm ci
      - name: Build NSIS installer
        run: task windows:build
      - name: Upload NSIS to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.nsis.zip)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No NSIS artifacts found under src-tauri/target/release/bundle/nsis" >&2
            exit 1
          fi
          for f in "${artifacts[@]}"; do
            gh release upload "${{ needs.release-macos.outputs.release_version }}" "$f" --clobber
          done

  cleanup-old-prereleases:
    runs-on: ubuntu-latest
    needs: release-macos
    steps:
      - name: Delete prior prereleases (keep current; nightly tags fully removed)
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ needs.release-macos.outputs.release_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t stale < <(
            gh release list \
              --repo "$REPO" \
              --limit 200 \
              --json tagName,isPrerelease,isDraft \
              | jq -r --arg current "$CURRENT" \
                  '.[] | select(.isPrerelease and (.isDraft | not) and .tagName != $current) | .tagName'
          )
          if (( ${#stale[@]} == 0 )); then
            echo "No stale prereleases to delete."
            exit 0
          fi
          for tag in "${stale[@]}"; do
            if [[ "$tag" == *-nightly.* ]]; then
              echo "Deleting nightly prerelease and tag: $tag"
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
            else
              echo "Deleting prerelease (keep tag): $tag"
              gh release delete "$tag" --repo "$REPO" --yes
            fi
          done
