version: "3"

# Per-OS task files. Included so that their tasks are reachable as
# `macos:*` / `windows:*` from the root Taskfile — existing callers keep
# working unchanged. `optional: true` means running on a different OS
# doesn't error on missing files, and each task inside carries a
# `platforms:` guard so cross-OS invocations are no-ops.
includes:
  macos:
    taskfile: ./taskfiles/Taskfile_darwin.yml
    optional: true
  windows:
    taskfile: ./taskfiles/Taskfile_windows.yml
    optional: true

tasks:
  dev:
    desc: "Run Tauri in development mode (also rebuilds and restarts the Roux daemon)"
    env:
      # Keep `task dev` isolated from normal Roux state while allowing
      # callers to point at a different test root explicitly.
      # Fall back to USERPROFILE when HOME is unset (native Windows) so the
      # default stays an absolute path; a non-absolute value is ignored by the
      # Rust ROUX_BASE_PATH override and would leak into normal Roux state.
      ROUX_BASE_PATH: '{{.ROUX_BASE_PATH | default (printf "%s/.config/roux-dev" (.HOME | default .USERPROFILE))}}'
    cmds:
      - task: frontend:ensure
      - task: cli:install
      - task: cli:stage-dev-binary
      - task: cli:restart-dev-daemon
      - npm run tauri dev

  dev:up:
    desc: "Install all dependencies (frontend + Rust)"
    cmds:
      - npm install
      - task: rust:setup
      - cd src-tauri && cargo check
      - task: cli:install

  dev:clean:
    desc: "Remove installed desktop app"
    cmds:
      - |
        APP="/Applications/Roux.app"
        if [ -d "$APP" ]; then
          rm -rf "$APP"
          echo "Removed $APP"
        else
          echo "No installed app found at $APP"
        fi

  cli:ensure-placeholder:
    desc: "Ensure a placeholder binary exists so Tauri build.rs doesn't fail on fresh checkouts"
    cmds:
      - cmd: |
          TARGET="${TAURI_TARGET:-$(rustc -vV | sed -n 's/^host: //p')}"
          mkdir -p src-tauri/binaries
          if [ ! -f "src-tauri/binaries/roux-${TARGET}" ]; then
            touch "src-tauri/binaries/roux-${TARGET}"
            chmod +x "src-tauri/binaries/roux-${TARGET}"
            echo "Created placeholder for roux-${TARGET}"
          fi
        platforms: [darwin, linux]
      # Task v3 runs `cmd:` blocks through bundled mvdan/sh on every
      # platform — including Windows — not through `cmd.exe`. Use POSIX
      # sh, mirroring `taskfiles/Taskfile_windows.yml::prepare-cli`.
      - cmd: |
          set -eu
          TARGET="${TAURI_TARGET:-$(rustc --print host-tuple)}"
          : "${TARGET:=x86_64-pc-windows-msvc}"
          mkdir -p src-tauri/binaries
          [ -f "src-tauri/binaries/roux.exe" ] || : > "src-tauri/binaries/roux.exe"
          [ -f "src-tauri/binaries/roux-${TARGET}.exe" ] || : > "src-tauri/binaries/roux-${TARGET}.exe"
        platforms: [windows]

  cli:install:
    desc: "Build and prepare the Roux CLI for local development"
    deps: [cli:ensure-placeholder]
    cmds:
      - cargo build -p roux-cli --bin roux
      - cmd: echo "Built target/debug/roux.exe for Windows dev use"
        platforms: [windows]
      - cmd: |
          mkdir -p ~/.local/bin
          cp target/debug/roux ~/.local/bin/roux
          chmod +x ~/.local/bin/roux
          echo "Installed roux to ~/.local/bin/roux"
        platforms: [darwin, linux]

  frontend:ensure:
    desc: "Install frontend dependencies when node_modules is missing"
    cmds:
      - cmd: |
          if [ ! -d node_modules ]; then
            npm install
          fi
        platforms: [darwin, linux]
      - cmd: |
          cmd /c "if not exist node_modules npm install"
        platforms: [windows]

  cli:stage-dev-binary:
    desc: "Stage debug Roux CLI for Tauri externalBin in dev"
    cmds:
      - cmd: |
          set -euo pipefail
          TARGET="${TAURI_TARGET:-$(rustc -vV | sed -n 's/^host: //p')}"
          mkdir -p src-tauri/binaries
          cp target/debug/roux src-tauri/binaries/roux
          cp target/debug/roux "src-tauri/binaries/roux-${TARGET}"
          chmod +x src-tauri/binaries/roux "src-tauri/binaries/roux-${TARGET}"
          echo "Prepared dev Roux CLI binaries for ${TARGET}"
        platforms: [darwin, linux]
      # POSIX sh via bundled mvdan/sh — see comment on cli:ensure-placeholder.
      # `rustc --print host-tuple` avoids depending on `sed`, which isn't on
      # PATH on a clean Windows install (unlike CI runners with git-bash).
      - cmd: |
          set -eu
          TARGET="${TAURI_TARGET:-$(rustc --print host-tuple)}"
          : "${TARGET:=x86_64-pc-windows-msvc}"
          mkdir -p src-tauri/binaries
          cp -f target/debug/roux.exe src-tauri/binaries/roux.exe
          cp -f target/debug/roux.exe "src-tauri/binaries/roux-${TARGET}.exe"
          echo "Prepared dev Roux CLI binaries for ${TARGET}"
        platforms: [windows]

  cli:restart-dev-daemon:
    desc: "Restart the freshly built debug Roux daemon for Tauri dev"
    env:
      # Fall back to USERPROFILE when HOME is unset (native Windows) so the
      # default stays an absolute path; a non-absolute value is ignored by the
      # Rust ROUX_BASE_PATH override and would leak into normal Roux state.
      ROUX_BASE_PATH: '{{.ROUX_BASE_PATH | default (printf "%s/.config/roux-dev" (.HOME | default .USERPROFILE))}}'
    cmds:
      - cmd: target/debug/roux daemon restart
        platforms: [darwin, linux]
      - cmd: target/debug/roux.exe daemon restart
        platforms: [windows]

  dev:install:
    desc: "Build and install the desktop app and CLI locally (unsigned, no updater artifacts)"
    cmds:
      # Stage a placeholder externalBin so the first `cargo build --bin
      # roux` (inside prepare-cli) doesn't fail Tauri's build-script
      # existence check on a clean checkout. See `cli:ensure-placeholder`.
      - task: cli:ensure-placeholder
      - task: macos:prepare-cli
      - npm run tauri build -- -c '{"bundle":{"createUpdaterArtifacts":false}}'
      - |
        # Install desktop app
        APP="/Applications/Roux.app"
        if [ -d "$APP" ]; then
          echo "Removing existing $APP"
          rm -rf "$APP"
        fi
        cp -R target/release/bundle/macos/Roux.app /Applications/
        echo "Installed Roux.app to /Applications"

  build:
    desc: "Build the app locally (unsigned, no updater artifacts). Use task sign for release builds."
    cmds:
      # See note in `dev:install`: ensure the placeholder before prepare-cli
      # so a clean checkout can build the CLI crate at all.
      - task: cli:ensure-placeholder
      - task: bundle:prepare-cli
      - npm run tauri build -- -c '{"bundle":{"createUpdaterArtifacts":false}}'

  build:frontend:
    desc: "Build frontend only"
    cmds:
      - npm run build

  check:
    desc: "Check both frontend and Rust compile"
    cmds:
      - npm run check
      - npm run build
      - cd src-tauri && RUSTFLAGS="-D warnings" cargo check

  check:rust:
    desc: "Check Rust compiles"
    cmds:
      - cd src-tauri && cargo check

  fmt:rust:
    desc: "Format Rust code"
    cmds:
      - cargo fmt --all --manifest-path src-tauri/Cargo.toml

  fmt:rust:check:
    desc: "Check Rust formatting"
    cmds:
      - cargo fmt-check

  lint:rust:
    desc: "Run Clippy on Rust code"
    cmds:
      - cargo lint -- -D warnings

  rust:setup:
    desc: "Install standard Rust development components"
    cmds:
      - rustup component add rustfmt clippy rust-src rust-analyzer

  test:
    desc: "Run all tests (Rust + frontend)"
    cmds:
      - npm run check
      - cd src-tauri && RUSTFLAGS="-D warnings" cargo test
      - npm test

  test:rust:
    desc: "Run Rust tests only"
    cmds:
      - cd src-tauri && cargo test

  test:frontend:
    desc: "Run frontend tests only"
    cmds:
      - npm test

  test:watch:
    desc: "Run frontend tests in watch mode"
    cmds:
      - npm run test:watch

  hooks:install:
    desc: "Manually re-install Claude Code hooks"
    cmds:
      - |
        echo "Hooks are auto-installed on app startup."
        echo "To force reinstall, delete ~/.config/roux/hook-handler.sh and restart Roux."
        cat ~/.claude/settings.json | python3 -c "import sys,json; h=json.load(sys.stdin).get('hooks',{}); [print(f'  {k}: {len(v)} hook(s)') for k,v in h.items() if any('roux' in str(e) for e in v)]"

  hooks:status:
    desc: "Show current session status files"
    cmds:
      - |
        DIR=~/.config/roux/status
        if [ -d "$DIR" ] && ls "$DIR"/*.json 1>/dev/null 2>&1; then
          for f in "$DIR"/*.json; do
            echo "$(basename $f):"
            cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  status={d.get(\"status\")} cwd={d.get(\"cwd\",\"?\")}')"
          done
        else
          echo "No status files found"
        fi

  clean:status:
    desc: "Clear all session status files"
    cmds:
      - cargo run -p roux-cli --target-dir src-tauri/target-task --bin roux -- clear

  bundle:prepare-cli:
    desc: "Build Roux CLI and stage it for bundling (darwin/linux). For Windows, use `task windows:prepare-cli`."
    cmds:
      - cmd: |
          set -euo pipefail
          TARGET="${TAURI_TARGET:-$(rustc -vV | sed -n 's/^host: //p')}"
          cargo build -p roux-cli --release --bin roux
          mkdir -p src-tauri/binaries
          cp target/release/roux src-tauri/binaries/roux
          cp target/release/roux "src-tauri/binaries/roux-${TARGET}"
          chmod +x src-tauri/binaries/roux "src-tauri/binaries/roux-${TARGET}"
          echo "Prepared bundled Roux CLI for ${TARGET}"
        platforms: [darwin, linux]

  cli:package-release:
    desc: "Build and package the standalone Roux CLI release tarball for this host"
    cmds:
      - ./scripts/package-cli-release.sh

  sign:
    desc: "Build, sign, notarize, and staple the macOS app"
    cmds:
      # See note in `dev:install`: ensure the placeholder before prepare-cli
      # so a clean checkout can build the CLI crate at all.
      - task: cli:ensure-placeholder
      - task: macos:prepare-cli
      - |
        set -euo pipefail
        ./scripts/run-macos-signing.sh npm run tauri build -- ${TAURI_BUILD_ARGS:-}
      - task: macos:notarize-dmg
      - task: macos:staple-dmg
      - task: macos:verify

  sign:op:
    desc: "Run the signing workflow with secrets loaded from 1Password"
    preconditions:
      - sh: "command -v op >/dev/null 2>&1"
        msg: "1Password CLI 'op' is required"
      - sh: '[ -f ".env.signing" ]'
        msg: ".env.signing is required"
    cmds:
      - |
        op run --env-file=.env.signing -- task sign

  build:signed:
    desc: "Alias for the macOS signing flow"
    cmds:
      - task: sign

  build:signed:op:
    desc: "Alias for the 1Password-backed macOS signing flow"
    cmds:
      - task: sign:op

  publish:
    desc: "Create or update the GitHub release for the current version and upload the signed app zip and DMG"
    preconditions:
      - sh: "command -v gh >/dev/null 2>&1"
        msg: "GitHub CLI 'gh' is required"
    cmds:
      - task: macos:zip-app
      - |
        set -euo pipefail
        TARGET_ROOT="target"
        if [ -n "${TAURI_TARGET:-}" ]; then
          TARGET_ROOT="${TARGET_ROOT}/${TAURI_TARGET}"
        fi

        VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
        TAG="v${VERSION}"
        APP_ZIP="${TARGET_ROOT}/release/bundle/macos/Roux_${VERSION}.app.zip"

        # Build changelog from commits since last tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges | grep -v "^- release:" || true)
        else
          CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | grep -v "^- release:" || true)
        fi

        # Detect pre-release versions (contain a hyphen, e.g. 0.3.0-alpha.1)
        PRE_FLAG=""
        if echo "$VERSION" | grep -q '-'; then
          PRE_FLAG="--prerelease"
        fi

        if ! gh release view "$TAG" &>/dev/null; then
          gh release create "$TAG" --title "$TAG" --notes "$CHANGELOG" $PRE_FLAG
          echo "Created release $TAG"
        else
          gh release edit "$TAG" --notes "$CHANGELOG" $PRE_FLAG
          echo "Updated release notes for $TAG"
        fi

        gh release upload "$TAG" "$APP_ZIP" --clobber
        echo "Uploaded $APP_ZIP to $TAG"

        find "${TARGET_ROOT}" -path "*/release/bundle/dmg/Roux_${VERSION}_*.dmg" -print | while read -r DMG; do
          gh release upload "$TAG" "$DMG" --clobber
          echo "Uploaded $DMG to $TAG"
        done

        # Updater manifest. Stable releases get `latest.json` (the fixed URL
        # Tauri's `endpoints` config points at). Prereleases get
        # `latest-prerelease.json`, which the Rust updater resolves by querying
        # the GitHub API for the newest prerelease tag and then fetching that
        # tag's manifest — so each prerelease owns its own manifest and the
        # "latest" stable release is never polluted with alpha artifacts.
        TARBALL_MATCHES=$(find "${TARGET_ROOT}" -path "*/release/bundle/macos/*.app.tar.gz" -print)
        TARBALL_COUNT=$(printf '%s\n' "$TARBALL_MATCHES" | grep -c . || true)
        if [ "$TARBALL_COUNT" -eq 0 ]; then
          echo "ERROR: no updater tarball (*.app.tar.gz) found under ${TARGET_ROOT}" >&2
          exit 1
        fi
        if [ "$TARBALL_COUNT" -gt 1 ]; then
          echo "ERROR: multiple updater tarballs found under ${TARGET_ROOT}:" >&2
          printf '%s\n' "$TARBALL_MATCHES" >&2
          exit 1
        fi
        TARBALL="$TARBALL_MATCHES"
        SIG_PATH="${TARBALL}.sig"
        if [ ! -f "$SIG_PATH" ]; then
          echo "ERROR: updater signature file missing: $SIG_PATH" >&2
          exit 1
        fi
        TARBALL_BASENAME=$(basename "$TARBALL")
        MANIFEST_DIR=$(dirname "$TARBALL")
        if [ -n "$PRE_FLAG" ]; then
          MANIFEST_NAME="latest-prerelease.json"
        else
          MANIFEST_NAME="latest.json"
        fi
        MANIFEST="${MANIFEST_DIR}/${MANIFEST_NAME}"
        PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        URL="https://github.com/phin-tech/roux/releases/download/${TAG}/${TARBALL_BASENAME}"

        ROUX_VERSION="$VERSION" \
        ROUX_NOTES="$CHANGELOG" \
        ROUX_PUB_DATE="$PUB_DATE" \
        ROUX_URL="$URL" \
        ROUX_SIG_PATH="$SIG_PATH" \
        ROUX_MANIFEST="$MANIFEST" \
        python3 -c '
        import json, os
        sig = open(os.environ["ROUX_SIG_PATH"]).read()
        manifest = {
            "version": os.environ["ROUX_VERSION"],
            "notes": os.environ["ROUX_NOTES"],
            "pub_date": os.environ["ROUX_PUB_DATE"],
            "platforms": {
                "darwin-aarch64": {
                    "signature": sig,
                    "url": os.environ["ROUX_URL"],
                },
            },
        }
        with open(os.environ["ROUX_MANIFEST"], "w") as f:
            json.dump(manifest, f, indent=2)
        '

        gh release upload "$TAG" "$TARBALL" "$SIG_PATH" "$MANIFEST" --clobber
        echo "Uploaded updater artifacts ($TARBALL_BASENAME, .sig, $MANIFEST_NAME) to $TAG"

  publish:op:
    desc: "Sign with 1Password-backed secrets, then publish the current version"
    cmds:
      - task: sign:op
      - task: publish

  version:
    desc: "Bump version, commit, tag, push. Usage: task version BUMP=patch|minor|major [PRE=alpha|beta|dev|rc]"
    requires:
      vars: [BUMP]
    preconditions:
      - sh: '[ "{{.BUMP}}" = "patch" ] || [ "{{.BUMP}}" = "minor" ] || [ "{{.BUMP}}" = "major" ]'
        msg: "BUMP must be one of: patch, minor, major"
      - sh: "git diff --quiet && git diff --cached --quiet"
        msg: "Working tree must be clean before releasing"
    cmds:
      - |
        set -euo pipefail

        # Find the last stable tag (no pre-release suffix) for base calculation
        LAST_STABLE=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$LAST_STABLE" ]; then
          CURRENT="0.1.0"
        else
          CURRENT=$(echo "$LAST_STABLE" | sed 's/^v//')
        fi
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

        case "{{.BUMP}}" in
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          patch) PATCH=$((PATCH + 1)) ;;
        esac

        BASE="${MAJOR}.${MINOR}.${PATCH}"
        PRE="{{.PRE}}"

        if [ -n "$PRE" ]; then
          # Auto-increment pre-release number based on existing tags
          LAST_PRE_NUM=$(git tag -l "v${BASE}-${PRE}.*" | sed "s/v${BASE}-${PRE}\.//" | sort -n | tail -1 || true)
          if [ -n "$LAST_PRE_NUM" ]; then
            PRE_NUM=$((LAST_PRE_NUM + 1))
          else
            PRE_NUM=1
          fi
          NEW="${BASE}-${PRE}.${PRE_NUM}"
          COMMIT_PREFIX="pre-release"
        else
          NEW="$BASE"
          COMMIT_PREFIX="release"
        fi

        echo "Bumping version: ${CURRENT} -> ${NEW}"

        # Update package.json
        sed -i '' "s/\"version\": \".*\"/\"version\": \"${NEW}\"/" package.json

        # Update tauri.conf.json
        python3 -c "
        import json
        with open('src-tauri/tauri.conf.json') as f:
            d = json.load(f)
        d['version'] = '${NEW}'
        with open('src-tauri/tauri.conf.json', 'w') as f:
            json.dump(d, f, indent=2)
        "

        # Update Cargo.toml
        sed -i '' "s/^version = \".*\"/version = \"${NEW}\"/" src-tauri/Cargo.toml

        git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
        git commit -m "${COMMIT_PREFIX}: v${NEW}"
        git tag "v${NEW}"
        git push origin main
        git push origin "v${NEW}"

        echo "Released v${NEW}"

  release:
    desc: "Cut a release. Stable: bump main locally + dispatch release.yml. Pre-release (PRE set): dispatch pre-build.yml (tag-only, no main commit; triggers release + /pre docs). Usage: task release BUMP=patch|minor|major [PRE=pre|alpha|beta|dev|rc]"
    requires:
      vars: [BUMP]
    cmds:
      - task: '{{if .PRE}}prerelease:dispatch{{else}}release:stable{{end}}'
        vars:
          BUMP: "{{.BUMP}}"
          PRE: "{{.PRE}}"

  release:stable:
    internal: true
    requires:
      vars: [BUMP]
    cmds:
      - task: version
        vars:
          BUMP: "{{.BUMP}}"
          PRE: ""
      - task: ci:trigger

  prerelease:dispatch:
    desc: "Dispatch the pre-build workflow (tag-only pre-release; triggers release + /pre docs). Usage: task prerelease:dispatch BUMP=patch [PRE=pre]"
    preconditions:
      - sh: "command -v gh >/dev/null 2>&1"
        msg: "GitHub CLI 'gh' is required"
    vars:
      BUMP_ARG: '{{default "patch" .BUMP}}'
      PRE_ARG: '{{default "pre" .PRE}}'
    cmds:
      - |
        set -euo pipefail
        echo "Dispatching pre-build workflow (BUMP={{.BUMP_ARG}}, PRE={{.PRE_ARG}})..."
        gh workflow run pre-build.yml \
          --ref main \
          -f bump="{{.BUMP_ARG}}" \
          -f pre="{{.PRE_ARG}}"
        sleep 2
        RUN_ID=$(gh run list --workflow=pre-build.yml --event=workflow_dispatch --limit=1 --json databaseId --jq '.[0].databaseId')
        if [ -z "${RUN_ID}" ]; then
          echo "Dispatched, but could not resolve the run ID. Check https://github.com/phin-tech/roux/actions" >&2
          exit 0
        fi
        echo "Watching run ${RUN_ID}..."
        gh run watch "${RUN_ID}" --exit-status

  ci:sync-secrets:
    desc: "Push signing/notarization/updater secrets from 1Password into GitHub Actions secrets"
    preconditions:
      - sh: "command -v op >/dev/null 2>&1"
        msg: "1Password CLI 'op' is required"
      - sh: "command -v gh >/dev/null 2>&1"
        msg: "GitHub CLI 'gh' is required"
      - sh: '[ -f ".env.signing" ]'
        msg: ".env.signing is required"
    cmds:
      - ./scripts/sync-gh-secrets.sh

  ci:trigger:
    desc: "Dispatch the release workflow for the current version in src-tauri/tauri.conf.json"
    preconditions:
      - sh: "command -v gh >/dev/null 2>&1"
        msg: "GitHub CLI 'gh' is required"
    cmds:
      - |
        set -euo pipefail
        VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
        TAG="v${VERSION}"
        echo "Dispatching release workflow for ${TAG}..."
        # Retry briefly because a freshly-pushed tag can take a few seconds
        # to register on GitHub before workflow_dispatch accepts it.
        for i in 1 2 3 4 5; do
          if gh workflow run release.yml -f version="${TAG}"; then
            break
          fi
          if [ "$i" = "5" ]; then
            echo "gh workflow run failed after 5 attempts" >&2
            exit 1
          fi
          echo "Dispatch attempt ${i} failed; retrying in 3s..."
          sleep 3
        done
        sleep 2
        RUN_ID=$(gh run list --workflow=release.yml --event=workflow_dispatch --limit=1 --json databaseId --jq '.[0].databaseId')
        if [ -z "${RUN_ID}" ]; then
          echo "Dispatched, but could not resolve the run ID. Check https://github.com/phin-tech/roux/actions" >&2
          exit 0
        fi
        echo "Watching run ${RUN_ID}..."
        gh run watch "${RUN_ID}" --exit-status

  docs:serve:
    desc: "Serve the MkDocs site locally with hot reload at http://127.0.0.1:8000/"
    cmds:
      - uv run --project docs mkdocs serve

  docs:build:
    desc: "Build the MkDocs site to ./site (strict mode — fails on warnings)"
    cmds:
      - uv run --project docs mkdocs build --strict

  docs:prerelease:
    desc: "Republish prerelease docs to https://phin-tech.github.io/roux/pre/. Usage: task docs:prerelease VERSION=0.5.4-pre.1 [SOURCE_REF=v0.5.4-pre.1]"
    requires:
      vars: [VERSION]
    vars:
      SOURCE_REF_ARG: '{{default "" .SOURCE_REF}}'
    preconditions:
      - sh: "command -v gh >/dev/null 2>&1"
        msg: "GitHub CLI 'gh' is required"
    cmds:
      - |
        set -euo pipefail
        VERSION="{{.VERSION}}"
        SOURCE_REF="{{.SOURCE_REF_ARG}}"
        if [ -z "$SOURCE_REF" ]; then
          SOURCE_REF="v${VERSION#v}"
        fi

        echo "Dispatching prerelease docs publish (VERSION=${VERSION}, SOURCE_REF=${SOURCE_REF})..."
        DISPATCHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        gh workflow run docs-prerelease.yml \
          --ref main \
          -f version="${VERSION}" \
          -f source_ref="${SOURCE_REF}"
        sleep 2
        RUN_ID=$(gh run list \
          --workflow=docs-prerelease.yml \
          --event=workflow_dispatch \
          --branch main \
          --created ">${DISPATCHED_AT}" \
          --limit=10 \
          --json databaseId,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // ""')
        if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
          echo "Dispatched, but could not resolve the run ID. Check https://github.com/phin-tech/roux/actions" >&2
          exit 0
        fi
        echo "Watching run ${RUN_ID}..."
        gh run watch "${RUN_ID}" --exit-status

  docs:landing:
    desc: "Serve the retro landing page locally at http://127.0.0.1:8765/"
    dir: docs/landing
    cmds:
      - python3 -m http.server 8765
