version: "3"

tasks:
  dev:
    desc: "Run Tauri in development mode (also rebuilds roux-cli)"
    cmds:
      - task: frontend:ensure
      - task: cli:install
      - task: cli:stage-dev-binary
      - npm run tauri dev

  dev:up:
    desc: "Install all dependencies (frontend + Rust)"
    cmds:
      - npm install
      - task: rust:setup
      - cd src-tauri && cargo check
      - task: cli:install

  dev:clean:
    desc: "Remove installed desktop app"
    cmds:
      - |
        APP="/Applications/Roux.app"
        if [ -d "$APP" ]; then
          rm -rf "$APP"
          echo "Removed $APP"
        else
          echo "No installed app found at $APP"
        fi

  cli:ensure-placeholder:
    desc: "Ensure a placeholder binary exists so Tauri build.rs doesn't fail on fresh checkouts"
    cmds:
      - cmd: |
          TARGET="${TAURI_TARGET:-$(rustc -vV | sed -n 's/^host: //p')}"
          mkdir -p src-tauri/binaries
          if [ ! -f "src-tauri/binaries/roux-cli-${TARGET}" ]; then
            touch "src-tauri/binaries/roux-cli-${TARGET}"
            chmod +x "src-tauri/binaries/roux-cli-${TARGET}"
            echo "Created placeholder for roux-cli-${TARGET}"
          fi
        platforms: [darwin, linux]
      - cmd: |
          if not exist src-tauri\binaries mkdir src-tauri\binaries
          if not exist src-tauri\binaries\roux-cli.exe echo. > src-tauri\binaries\roux-cli.exe
        platforms: [windows]

  cli:install:
    desc: "Build and prepare roux-cli for local development"
    deps: [cli:ensure-placeholder]
    cmds:
      - cargo build --manifest-path src-tauri/Cargo.toml --bin roux-cli
      - cmd: |
          cmd /c echo Built src-tauri\target\debug\roux-cli.exe for Windows dev use
        platforms: [windows]
      - cmd: |
          mkdir -p ~/.local/bin
          cp target/debug/roux-cli ~/.local/bin/roux-cli
          chmod +x ~/.local/bin/roux-cli
          echo "Installed roux-cli to ~/.local/bin/roux-cli"
        platforms: [darwin, linux]

  frontend:ensure:
    desc: "Install frontend dependencies when node_modules is missing"
    cmds:
      - cmd: |
          if [ ! -d node_modules ]; then
            npm install
          fi
        platforms: [darwin, linux]
      - cmd: |
          cmd /c "if not exist node_modules npm install"
        platforms: [windows]

  cli:stage-dev-binary:
    desc: "Stage debug roux-cli for Tauri externalBin in dev"
    cmds:
      - cmd: |
          set -euo pipefail
          TARGET="${TAURI_TARGET:-$(rustc -vV | sed -n 's/^host: //p')}"
          mkdir -p src-tauri/binaries
          cp target/debug/roux-cli src-tauri/binaries/roux-cli
          cp target/debug/roux-cli "src-tauri/binaries/roux-cli-${TARGET}"
          chmod +x src-tauri/binaries/roux-cli "src-tauri/binaries/roux-cli-${TARGET}"
          echo "Prepared dev roux-cli binaries for ${TARGET}"
        platforms: [darwin, linux]
      - cmd: |
          for /f "tokens=2 delims=: " %%a in ('rustc -vV ^| findstr /b "host:"') do set HOST=%%a
          if not defined HOST set HOST=%TAURI_TARGET%
          if not defined HOST set HOST=x86_64-pc-windows-msvc
          if not exist src-tauri\binaries mkdir src-tauri\binaries
          copy /Y target\debug\roux-cli.exe src-tauri\binaries\roux-cli.exe >nul
          copy /Y target\debug\roux-cli.exe src-tauri\binaries\roux-cli-%HOST%.exe >nul
          echo Prepared dev roux-cli binaries for %HOST%
        platforms: [windows]

  dev:install:
    desc: "Build and install the desktop app and CLI locally (unsigned, no updater artifacts)"
    cmds:
      - task: macos:prepare-cli
      - npm run tauri build -- -c '{"bundle":{"createUpdaterArtifacts":false}}'
      - |
        # Install desktop app
        APP="/Applications/Roux.app"
        if [ -d "$APP" ]; then
          echo "Removing existing $APP"
          rm -rf "$APP"
        fi
        cp -R target/release/bundle/macos/Roux.app /Applications/
        echo "Installed Roux.app to /Applications"

  build:
    desc: "Build the app locally (unsigned, no updater artifacts). Use task sign for release builds."
    cmds:
      - task: bundle:prepare-cli
      - npm run tauri build -- -c '{"bundle":{"createUpdaterArtifacts":false}}'

  build:frontend:
    desc: "Build frontend only"
    cmds:
      - npm run build

  check:
    desc: "Check both frontend and Rust compile"
    cmds:
      - npm run check
      - npm run build
      - cd src-tauri && RUSTFLAGS="-D warnings" cargo check

  check:rust:
    desc: "Check Rust compiles"
    cmds:
      - cd src-tauri && cargo check

  fmt:rust:
    desc: "Format Rust code"
    cmds:
      - cargo fmt --all --manifest-path src-tauri/Cargo.toml

  fmt:rust:check:
    desc: "Check Rust formatting"
    cmds:
      - cargo fmt-check

  lint:rust:
    desc: "Run Clippy on Rust code"
    cmds:
      - cargo lint -- -D warnings

  rust:setup:
    desc: "Install standard Rust development components"
    cmds:
      - rustup component add rustfmt clippy rust-src rust-analyzer

  test:
    desc: "Run all tests (Rust + frontend)"
    cmds:
      - npm run check
      - cd src-tauri && RUSTFLAGS="-D warnings" cargo test
      - npm test

  test:rust:
    desc: "Run Rust tests only"
    cmds:
      - cd src-tauri && cargo test

  test:frontend:
    desc: "Run frontend tests only"
    cmds:
      - npm test

  test:watch:
    desc: "Run frontend tests in watch mode"
    cmds:
      - npm run test:watch

  hooks:install:
    desc: "Manually re-install Claude Code hooks"
    cmds:
      - |
        echo "Hooks are auto-installed on app startup."
        echo "To force reinstall, delete ~/.config/roux/hook-handler.sh and restart Roux."
        cat ~/.claude/settings.json | python3 -c "import sys,json; h=json.load(sys.stdin).get('hooks',{}); [print(f'  {k}: {len(v)} hook(s)') for k,v in h.items() if any('roux' in str(e) for e in v)]"

  hooks:status:
    desc: "Show current session status files"
    cmds:
      - |
        DIR=~/.config/roux/status
        if [ -d "$DIR" ] && ls "$DIR"/*.json 1>/dev/null 2>&1; then
          for f in "$DIR"/*.json; do
            echo "$(basename $f):"
            cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  status={d.get(\"status\")} cwd={d.get(\"cwd\",\"?\")}')"
          done
        else
          echo "No status files found"
        fi

  clean:status:
    desc: "Clear all session status files"
    cmds:
      - cargo run --manifest-path src-tauri/Cargo.toml --target-dir src-tauri/target-task --bin roux-cli -- clear

  bundle:prepare-cli:
    desc: "Build roux-cli and stage it for bundling"
    cmds:
      - cargo build --manifest-path src-tauri/Cargo.toml --release --bin roux-cli
      - cmd: |
          cmd /c "if not exist src-tauri\binaries mkdir src-tauri\binaries && copy /Y target\release\roux-cli.exe src-tauri\binaries\roux-cli.exe >nul && echo Prepared bundled roux-cli.exe"
        platforms: [windows]
      - cmd: |
          mkdir -p src-tauri/binaries
          cp target/release/roux-cli src-tauri/binaries/roux-cli
          chmod +x src-tauri/binaries/roux-cli
          echo "Prepared bundled roux-cli"
        platforms: [darwin, linux]

  windows:build:
    desc: "Build the Windows NSIS installer"
    cmds:
      - task: bundle:prepare-cli
      - npm run tauri build -- --bundles nsis

  macos:prepare-cli:
    desc: "Build roux-cli and stage it for macOS bundling"
    cmds:
      - |
        set -euo pipefail
        if [ -n "${TAURI_TARGET:-}" ]; then
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin roux-cli --target "${TAURI_TARGET}"
          SOURCE="target/${TAURI_TARGET}/release/roux-cli"
        else
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin roux-cli
          SOURCE="target/release/roux-cli"
        fi
        mkdir -p src-tauri/binaries
        cp "${SOURCE}" src-tauri/binaries/roux-cli
        chmod +x src-tauri/binaries/roux-cli
        echo "Prepared bundled roux-cli from ${SOURCE}"

  macos:verify:
    desc: "Verify the latest signed macOS artifacts"
    cmds:
      - |
        set -euo pipefail
        TARGET_ROOT="target"
        if [ -n "${TAURI_TARGET:-}" ]; then
          TARGET_ROOT="${TARGET_ROOT}/${TAURI_TARGET}"
        fi

        APP="${TARGET_ROOT}/release/bundle/macos/Roux.app"
        DMG_DIR="${TARGET_ROOT}/release/bundle/dmg"
        DMG="$(find "${DMG_DIR}" -maxdepth 1 -name 'Roux_*.dmg' | sort | tail -n 1)"

        codesign --verify --deep --strict --verbose=2 "${APP}"
        spctl --assess --type execute --verbose=4 "${APP}"

        if [ -n "${DMG}" ]; then
          xcrun stapler validate "${DMG}"
        fi

  macos:staple-dmg:
    desc: "Staple the latest signed macOS DMG"
    cmds:
      - |
        set -euo pipefail
        TARGET_ROOT="target"
        if [ -n "${TAURI_TARGET:-}" ]; then
          TARGET_ROOT="${TARGET_ROOT}/${TAURI_TARGET}"
        fi

        DMG_DIR="${TARGET_ROOT}/release/bundle/dmg"
        DMG="$(find "${DMG_DIR}" -maxdepth 1 -name 'Roux_*.dmg' | sort | tail -n 1)"

        if [ -n "${DMG}" ]; then
          xcrun stapler staple "${DMG}"
        fi

  macos:zip-app:
    desc: "Zip the latest signed macOS app bundle"
    cmds:
      - |
        set -euo pipefail
        TARGET_ROOT="target"
        if [ -n "${TAURI_TARGET:-}" ]; then
          TARGET_ROOT="${TARGET_ROOT}/${TAURI_TARGET}"
        fi

        VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
        APP="${TARGET_ROOT}/release/bundle/macos/Roux.app"
        APP_ZIP="${TARGET_ROOT}/release/bundle/macos/Roux_${VERSION}.app.zip"

        rm -f "${APP_ZIP}"
        ditto -c -k --sequesterRsrc --keepParent "${APP}" "${APP_ZIP}"
        echo "Prepared ${APP_ZIP}"

  macos:notarize-dmg:
    desc: "Notarize the latest signed macOS DMG"
    cmds:
      - |
        set -euo pipefail
        TARGET_ROOT="target"
        if [ -n "${TAURI_TARGET:-}" ]; then
          TARGET_ROOT="${TARGET_ROOT}/${TAURI_TARGET}"
        fi

        DMG_DIR="${TARGET_ROOT}/release/bundle/dmg"
        DMG="$(find "${DMG_DIR}" -maxdepth 1 -name 'Roux_*.dmg' | sort | tail -n 1)"

        if [ -z "${DMG}" ]; then
          echo "No DMG found to notarize"
          exit 0
        fi

        export DMG
        ./scripts/run-macos-signing.sh sh -c '
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          elif [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            xcrun notarytool submit "$DMG" \
              --key "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --key-path "$APPLE_API_KEY_PATH" \
              --wait
          else
            echo "Missing notarization credentials for DMG submission" >&2
            exit 1
          fi
        '

  sign:
    desc: "Build, sign, notarize, and staple the macOS app"
    cmds:
      - task: macos:prepare-cli
      - |
        set -euo pipefail
        ./scripts/run-macos-signing.sh npm run tauri build -- ${TAURI_BUILD_ARGS:-}
      - task: macos:notarize-dmg
      - task: macos:staple-dmg
      - task: macos:verify

  sign:op:
    desc: "Run the signing workflow with secrets loaded from 1Password"
    preconditions:
      - sh: "command -v op >/dev/null 2>&1"
        msg: "1Password CLI 'op' is required"
      - sh: '[ -f ".env.signing" ]'
        msg: ".env.signing is required"
    cmds:
      - |
        op run --env-file=.env.signing -- task sign

  build:signed:
    desc: "Alias for the macOS signing flow"
    cmds:
      - task: sign

  build:signed:op:
    desc: "Alias for the 1Password-backed macOS signing flow"
    cmds:
      - task: sign:op

  publish:
    desc: "Create or update the GitHub release for the current version and upload the signed app zip and DMG"
    preconditions:
      - sh: "command -v gh >/dev/null 2>&1"
        msg: "GitHub CLI 'gh' is required"
    cmds:
      - task: macos:zip-app
      - |
        set -euo pipefail
        TARGET_ROOT="target"
        if [ -n "${TAURI_TARGET:-}" ]; then
          TARGET_ROOT="${TARGET_ROOT}/${TAURI_TARGET}"
        fi

        VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
        TAG="v${VERSION}"
        APP_ZIP="${TARGET_ROOT}/release/bundle/macos/Roux_${VERSION}.app.zip"

        # Build changelog from commits since last tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges | grep -v "^- release:" || true)
        else
          CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | grep -v "^- release:" || true)
        fi

        # Detect pre-release versions (contain a hyphen, e.g. 0.3.0-alpha.1)
        PRE_FLAG=""
        if echo "$VERSION" | grep -q '-'; then
          PRE_FLAG="--prerelease"
        fi

        if ! gh release view "$TAG" &>/dev/null; then
          gh release create "$TAG" --title "$TAG" --notes "$CHANGELOG" $PRE_FLAG
          echo "Created release $TAG"
        else
          gh release edit "$TAG" --notes "$CHANGELOG" $PRE_FLAG
          echo "Updated release notes for $TAG"
        fi

        gh release upload "$TAG" "$APP_ZIP" --clobber
        echo "Uploaded $APP_ZIP to $TAG"

        find "${TARGET_ROOT}" -path "*/release/bundle/dmg/Roux_${VERSION}_*.dmg" -print | while read -r DMG; do
          gh release upload "$TAG" "$DMG" --clobber
          echo "Uploaded $DMG to $TAG"
        done

        # Updater manifest: skip for prereleases so they never become "latest" for everyone.
        if [ -n "$PRE_FLAG" ]; then
          echo "Skipping updater manifest for prerelease $TAG"
        else
          TARBALL_MATCHES=$(find "${TARGET_ROOT}" -path "*/release/bundle/macos/*.app.tar.gz" -print)
          TARBALL_COUNT=$(printf '%s\n' "$TARBALL_MATCHES" | grep -c . || true)
          if [ "$TARBALL_COUNT" -eq 0 ]; then
            echo "ERROR: no updater tarball (*.app.tar.gz) found under ${TARGET_ROOT}" >&2
            exit 1
          fi
          if [ "$TARBALL_COUNT" -gt 1 ]; then
            echo "ERROR: multiple updater tarballs found under ${TARGET_ROOT}:" >&2
            printf '%s\n' "$TARBALL_MATCHES" >&2
            exit 1
          fi
          TARBALL="$TARBALL_MATCHES"
          SIG_PATH="${TARBALL}.sig"
          if [ ! -f "$SIG_PATH" ]; then
            echo "ERROR: updater signature file missing: $SIG_PATH" >&2
            exit 1
          fi
          TARBALL_BASENAME=$(basename "$TARBALL")
          MANIFEST_DIR=$(dirname "$TARBALL")
          MANIFEST="${MANIFEST_DIR}/latest.json"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://github.com/phin-tech/roux/releases/download/${TAG}/${TARBALL_BASENAME}"

          ROUX_VERSION="$VERSION" \
          ROUX_NOTES="$CHANGELOG" \
          ROUX_PUB_DATE="$PUB_DATE" \
          ROUX_URL="$URL" \
          ROUX_SIG_PATH="$SIG_PATH" \
          ROUX_MANIFEST="$MANIFEST" \
          python3 -c '
          import json, os
          sig = open(os.environ["ROUX_SIG_PATH"]).read()
          manifest = {
              "version": os.environ["ROUX_VERSION"],
              "notes": os.environ["ROUX_NOTES"],
              "pub_date": os.environ["ROUX_PUB_DATE"],
              "platforms": {
                  "darwin-aarch64": {
                      "signature": sig,
                      "url": os.environ["ROUX_URL"],
                  },
              },
          }
          with open(os.environ["ROUX_MANIFEST"], "w") as f:
              json.dump(manifest, f, indent=2)
          '

          gh release upload "$TAG" "$TARBALL" "$SIG_PATH" "$MANIFEST" --clobber
          echo "Uploaded updater artifacts ($TARBALL_BASENAME, .sig, latest.json) to $TAG"
        fi

  publish:op:
    desc: "Sign with 1Password-backed secrets, then publish the current version"
    cmds:
      - task: sign:op
      - task: publish

  version:
    desc: "Bump version, commit, tag, push. Usage: task version BUMP=patch|minor|major [PRE=alpha|beta|dev|rc]"
    requires:
      vars: [BUMP]
    preconditions:
      - sh: '[ "{{.BUMP}}" = "patch" ] || [ "{{.BUMP}}" = "minor" ] || [ "{{.BUMP}}" = "major" ]'
        msg: "BUMP must be one of: patch, minor, major"
      - sh: "git diff --quiet && git diff --cached --quiet"
        msg: "Working tree must be clean before releasing"
    cmds:
      - |
        set -euo pipefail

        # Find the last stable tag (no pre-release suffix) for base calculation
        LAST_STABLE=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$LAST_STABLE" ]; then
          CURRENT="0.1.0"
        else
          CURRENT=$(echo "$LAST_STABLE" | sed 's/^v//')
        fi
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

        case "{{.BUMP}}" in
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          patch) PATCH=$((PATCH + 1)) ;;
        esac

        BASE="${MAJOR}.${MINOR}.${PATCH}"
        PRE="{{.PRE}}"

        if [ -n "$PRE" ]; then
          # Auto-increment pre-release number based on existing tags
          LAST_PRE_NUM=$(git tag -l "v${BASE}-${PRE}.*" | sed "s/v${BASE}-${PRE}\.//" | sort -n | tail -1 || true)
          if [ -n "$LAST_PRE_NUM" ]; then
            PRE_NUM=$((LAST_PRE_NUM + 1))
          else
            PRE_NUM=1
          fi
          NEW="${BASE}-${PRE}.${PRE_NUM}"
          COMMIT_PREFIX="pre-release"
        else
          NEW="$BASE"
          COMMIT_PREFIX="release"
        fi

        echo "Bumping version: ${CURRENT} -> ${NEW}"

        # Update package.json
        sed -i '' "s/\"version\": \".*\"/\"version\": \"${NEW}\"/" package.json

        # Update tauri.conf.json
        python3 -c "
        import json
        with open('src-tauri/tauri.conf.json') as f:
            d = json.load(f)
        d['version'] = '${NEW}'
        with open('src-tauri/tauri.conf.json', 'w') as f:
            json.dump(d, f, indent=2)
        "

        # Update Cargo.toml
        sed -i '' "s/^version = \".*\"/version = \"${NEW}\"/" src-tauri/Cargo.toml

        git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
        git commit -m "${COMMIT_PREFIX}: v${NEW}"
        git tag "v${NEW}"
        git push origin main
        git push origin "v${NEW}"

        echo "Released v${NEW}"

  release:
    desc: "Bump version, build, sign, notarize, and publish in one shot. Usage: task release BUMP=patch|minor|major [PRE=alpha|beta|dev|rc]"
    requires:
      vars: [BUMP]
    cmds:
      - task: version
        vars:
          BUMP: "{{.BUMP}}"
          PRE: "{{.PRE}}"
      - task: publish:op
