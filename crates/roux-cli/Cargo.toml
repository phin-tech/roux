[package]
name = "roux-cli"
version = "0.5.4-pre.29"
description = "Command-line client and daemon entrypoint for Roux"
authors = ["phin-tech"]
edition = "2021"
default-run = "roux"

[lints]
workspace = true

[[bin]]
name = "roux"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rmcp = { version = "1.6.0", features = ["server", "transport-io", "schemars"] }
roux-core = { path = "../roux-core" }
roux-runtime = { path = "../roux-runtime" }
roux-sdk = { path = "../roux-sdk" }
roux-worktrunk = { path = "../roux-worktrunk" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
