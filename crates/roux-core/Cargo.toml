[package]
name = "roux-core"
version = "0.1.0"
edition = "2021"
description = "Shared types and models for Roux"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.24", features = ["derive", "serde_json"] }
thiserror = "2"
dirs = "6"
kdl = "6.5"
plist = "1"

[dev-dependencies]
tempfile = "3"
