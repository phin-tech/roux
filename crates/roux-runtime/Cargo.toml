[package]
name = "roux-runtime"
version = "0.1.0"
edition = "2021"
description = "Tauri-free runtime services for Roux"

[lints]
workspace = true

[dependencies]
anyhow = "1"
portable-pty = "0.9"
roux-core = { path = "../roux-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
