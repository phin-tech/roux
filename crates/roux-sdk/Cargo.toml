[package]
name = "roux-sdk"
version = "0.1.0"
edition = "2021"
description = "Typed Rust SDK for the Roux daemon API"
readme = "README.md"

[lints]
workspace = true

[dependencies]
dirs = "6"
roux-core = { path = "../roux-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3"
