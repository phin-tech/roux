[package]
name = "roux-smolvm"
version = "0.1.0"
edition = "2021"
description = "Shell-out wrapper around the smol machines (`smolvm`) CLI for Roux"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
which = "8"

[dev-dependencies]
tempfile = "3"
