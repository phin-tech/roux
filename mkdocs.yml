site_name: Roux
site_description: A desktop terminal multiplexer for Claude Code
site_url: https://phin-tech.github.io/roux/
repo_url: https://github.com/phin-tech/roux
repo_name: phin-tech/roux
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  plans/
  v2/
  superpowers/
  landing/
  pyproject.toml
  uv.lock
  requirements.txt

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # Social cards (Open Graph/Twitter preview images) are generated at build
  # time and require Cairo/imaging libs. Off by default so local builds and
  # strict link-checks work without Cairo; the deploy workflows set
  # SOCIAL_CARDS=true on the steps that publish the site.
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]

# Version selector dropdown, backed by mike (versions published to gh-pages).
# Reads versions.json at the deploy root; populated by the docs workflows.
extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - What's New: whats-new.md
  - Install: install.md
  - Getting Started: getting-started.md
  - Features:
      - Overview: features/index.md
      - Panes: features/panes.md
      - Multiline Editor: features/editor.md
      - Sessions: features/sessions.md
      - Projects: features/projects.md
      - Layouts: features/layouts.md
      - Worktrees: features/worktrees.md
      - Library: features/library.md
      - Notifications: features/notifications.md
      - Mailbox & Bus: features/mailbox.md
      - Watches: features/watches.md
      - Automation hooks: features/hooks.md
      - CLI: features/cli.md
      - Notes: features/notes.md
      - Keymap: features/keymap.md
  - Keyboard Shortcuts: keyboard-shortcuts.md
  - Settings: settings.md
  - Troubleshooting: troubleshooting.md
