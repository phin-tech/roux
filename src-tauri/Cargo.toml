[package]
name = "roux"
version = "0.5.3-pre.8"
description = "A multi-session Claude Code terminal manager"
authors = ["phin-tech"]
edition = "2021"
default-run = "roux"

[lints]
workspace = true

[lib]
name = "roux_lib"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "roux"
path = "src/main.rs"

[[bin]]
name = "roux-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
base64 = "0.22"
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
notify = "7"
serde_yaml = "0.9"
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "process", "time", "sync"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json"] }
url = "2"
octocrab = "0.44"
tauri-plugin-opener = "2.5.3"
thiserror = "2"
toml = "0.8"
minijinja = "2"
roux-core = { path = "../crates/roux-core" }
roux-git = { path = "../crates/roux-git" }
roux-worktrunk = { path = "../crates/roux-worktrunk" }
specta = { version = "=2.0.0-rc.24", features = ["derive", "serde_json"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
vte = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
