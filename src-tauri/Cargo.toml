[package]
name = "roux"
version = "0.1.0"
description = "A multi-session Claude Code terminal manager"
authors = ["phin-tech"]
edition = "2021"

[lib]
name = "roux_lib"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "roux"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
base64 = "0.22"
dirs = "6"
tauri-plugin-dialog = "2"
