[package]
name = "roux"
version = "0.2.1"
description = "A multi-session Claude Code terminal manager"
authors = ["phin-tech"]
edition = "2021"
default-run = "roux"

[lib]
name = "roux_lib"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "roux"
path = "src/main.rs"

[[bin]]
name = "roux-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
base64 = "0.22"
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
notify = "7"
serde_yaml = "0.9"
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "process", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json"] }
octocrab = "0.44"

[dev-dependencies]
tempfile = "3"
