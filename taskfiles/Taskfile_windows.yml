version: "3"

# Windows-specific tasks. Included from the root Taskfile under the
# `windows:` namespace, so external callers still use e.g.
# `task windows:build`. Every task carries `platforms: [windows]` as a
# guard — no-op rather than failing obscurely if invoked on another OS.

tasks:
  prepare-cli:
    desc: "Build Roux CLI and stage it for Windows bundling"
    cmds:
      - cargo build -p roux-cli --release --bin roux
      - cmd: |
          set -eu
          TARGET="${TAURI_TARGET:-$(rustc --print host-tuple)}"
          : "${TARGET:=x86_64-pc-windows-msvc}"
          mkdir -p src-tauri/binaries
          cp -f target/release/roux.exe src-tauri/binaries/roux.exe
          cp -f target/release/roux.exe "src-tauri/binaries/roux-${TARGET}.exe"
          cp -f target/release/roux.exe src-tauri/binaries/roux-cli.exe
          cp -f target/release/roux.exe "src-tauri/binaries/roux-cli-${TARGET}.exe"
          echo "Prepared bundled Roux CLI for ${TARGET}"
        platforms: [windows]

  build:
    desc: "Build the Windows NSIS installer"
    cmds:
      - task: prepare-cli
      - cmd: npm run tauri build -- --bundles nsis
        platforms: [windows]
